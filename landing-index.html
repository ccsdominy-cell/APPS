<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mygcsehub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,700;0,900;1,700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #f7f6f2;
      --surface:  #ffffff;
      --ink:      #1a1a1a;
      --muted:    #666;
      --border:   #e4e2db;
      --shadow:   0 2px 12px rgba(0,0,0,.07);
      --shadow-h: 0 6px 24px rgba(0,0,0,.13);
      --radius:   16px;
      --fr:       #0055a4;   /* French blue */
      --es:       #c60b1e;   /* Spanish red */
      --rs:       #4a3f8a;   /* RS purple */
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg:      #111110;
        --surface: #1e1d1b;
        --ink:     #f0ede6;
        --muted:   #999;
        --border:  #2e2d29;
        --shadow:  0 2px 12px rgba(0,0,0,.4);
        --shadow-h:0 6px 24px rgba(0,0,0,.55);
      }
    }
    :root[data-theme="dark"] {
      --bg:      #111110;
      --surface: #1e1d1b;
      --ink:     #f0ede6;
      --muted:   #999;
      --border:  #2e2d29;
      --shadow:  0 2px 12px rgba(0,0,0,.4);
      --shadow-h:0 6px 24px rgba(0,0,0,.55);
    }

    body {
      font-family: 'Outfit', system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 16px;
    }

    header {
      text-align: center;
      margin-bottom: 48px;
    }

    .wordmark {
      font-family: 'Fraunces', Georgia, serif;
      font-weight: 900;
      font-size: clamp(2rem, 6vw, 3.2rem);
      letter-spacing: -0.03em;
      color: var(--ink);
      line-height: 1;
    }

    .wordmark span {
      color: var(--muted);
      font-weight: 700;
    }

    .tagline { display: none; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 740px;
    }

    .card {
      background: color-mix(in srgb, var(--accent) 5%, var(--surface));
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 32px 24px 24px;
      text-decoration: none;
      color: var(--ink);
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 10px;
      box-shadow: var(--shadow);
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
      background: var(--accent);
      border-radius: var(--radius) var(--radius) 0 0;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-h);
      border-color: var(--accent);
    }

    .card[data-subject="fr"] { --accent: var(--fr); }
    .card[data-subject="es"] { --accent: var(--es); }
    .card[data-subject="rs"] { --accent: var(--rs); }

    .card-title {
      font-family: 'Fraunces', Georgia, serif;
      font-weight: 700;
      font-size: 1.45rem;
      line-height: 1.1;
      color: var(--ink);
    }

    .card-cta {
      margin-top: auto;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 4px;
      padding-top: 10px;
    }

    .card:hover .card-cta {
      color: var(--accent);
    }

    .card-cta svg {
      width: 14px; height: 14px;
      transition: transform .18s ease;
    }

    .card:hover .card-cta svg {
      transform: translateX(3px);
    }

    .card-spec {
      font-size: 0.68rem;
      font-weight: 400;
      color: var(--muted);
      letter-spacing: 0.05em;
      margin-top: 6px;
      opacity: 0.7;
    }

    footer {
      margin-top: 56px;
      font-size: 0.78rem;
      color: var(--muted);
      text-align: center;
    }

    @media (max-width: 660px) {
      .grid { grid-template-columns: 1fr; }
      header { margin-bottom: 36px; }
    }
  </style>
</head>
<body>

  <header>
    <div class="wordmark">my<span>gcse</span>hub</div>
    <p class="tagline">AQA GCSE Revision</p>
  </header>

  <main class="grid">

    <a class="card" href="/APPS/" data-subject="fr">
      <div class="card-title">French</div>
      <div class="card-cta">
        Start revision
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 8h10M9 4l4 4-4 4"/>
        </svg>
      </div>

    </a>

    <a class="card" href="/APPS/" data-subject="es">
      <div class="card-title">Spanish</div>
      <div class="card-cta">
        Start revision
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 8h10M9 4l4 4-4 4"/>
        </svg>
      </div>

    </a>

    <a class="card" href="/GCSE-RS.html" data-subject="rs">
      <div class="card-title">Religious Studies</div>
      <div class="card-cta">
        Start revision
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 8h10M9 4l4 4-4 4"/>
        </svg>
      </div>

    </a>

  </main>

  <footer>
    &copy; 2026 mygcsehub &nbsp;·&nbsp; Built for AQA GCSE · 2027 exams
  </footer>

</body>
</html>
